reviews:
  tone: concise
  guidelines: |
    모든 코드 리뷰는 반드시 한국어로 작성해주세요.
    불필요한 영어 설명은 피하고, 한국어 기술 용어를 우선 사용하세요.

    리뷰 시 반드시 다음 형식으로 설명하세요:
    1. 코드 실행 및 렌더링 과정 설명
       - 컴포넌트 렌더링 흐름
       - 상태 변경에 따른 리렌더 트리거
       - props, context, effect의 호출 순서
    2. 현재 구현의 문제점
    3. 개선 방향 및 대안

    과정 설명은 생략하지 말고, 단계별로 명확히 작성하세요.

    리뷰 시 중점 사항:
    - 컴포넌트 분리 및 재사용성
    - 상태 관리 및 데이터 흐름의 명확성
    - TypeScript 타입 안정성
    - 예외 처리 및 에러 핸들링
    - 비동기 처리의 신뢰성
    - 가독성 및 유지보수성
